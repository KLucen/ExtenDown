[package]
name = "extendown"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
flate2 = "=1.1.10"
uuid = { version = "1.29.0", features = ["v4"] }
base64 = "0.22.1"
percent-encoding = "2.3.2"
rfd = "=0.15.4"
tempfile = "3.27.0"
tauri-plugin-single-instance = "=2.5.5"
trash = { version = "=5.4.0", default-features = false, features = ["coinit_apartmentthreaded", "freedesktop"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
